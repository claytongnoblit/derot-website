name: SEO weekly maintenance

# Sundays 14:05 UTC: pull Search Console data, discover and triage new keywords,
# refresh one aging article if due, and post a report issue.

on:
  schedule:
    - cron: "5 14 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  issues: write

concurrency:
  group: seo-content
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: seo/requirements.txt
      - run: pip install -r seo/requirements.txt

      # Subscription backend: headless Claude Code, pinned to the version whose flags
      # and token handling were verified (bump deliberately, then run a dry run).
      - name: Install Claude Code
        run: |
          backend=$(python -c "import yaml;print((yaml.safe_load(open('seo/config.yaml')).get('llm') or {}).get('backend','api'))")
          echo "LLM_BACKEND=$backend" >> "$GITHUB_ENV"
          if [ "$backend" = "subscription" ]; then
            npm install -g @anthropic-ai/claude-code@2.1.295
            claude --version
          fi
      - name: Self-test (offline)
        working-directory: seo
        run: python -m pytest

      - name: Search Console, keyword expansion, report
        id: weekly
        working-directory: seo
        run: python -m derot_seo weekly

      - name: Refresh one aging article (if due)
        id: refresh
        if: steps.weekly.outcome == 'success'
        working-directory: seo
        run: |
          set +e
          python -m derot_seo refresh
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ $code -ne 0 ] && [ $code -ne 10 ] && [ $code -ne 20 ]; then exit $code; fi

      # Commit even if the refresh failed, so the paid-for keyword expansion is kept.
      - name: Commit
        id: push
        if: always() && steps.weekly.outcome == 'success'
        run: |
          git config user.name "derot-seo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "deployed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "SEO: weekly maintenance $(date -u +%Y-%m-%d)"
          ok=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
          if [ "$ok" != "1" ]; then echo "::error::Could not push to main after 3 attempts"; exit 1; fi
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger GitHub Pages build
        if: always() && steps.push.outputs.deployed == 'true'
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true

      - name: IndexNow for refreshed article
        if: always() && steps.push.outputs.deployed == 'true' && steps.refresh.outputs.url != ''
        working-directory: seo
        env:
          URL: ${{ steps.refresh.outputs.url }}
        run: sleep 120 && python -m derot_seo indexnow "$URL" "https://derot.org/sitemap.xml"

      - name: Post report issue
        if: always()
        run: |
          report=$(ls -t seo/out/reports/*.md 2>/dev/null | head -1)
          [ -z "$report" ] && exit 0
          gh label create seo-report --color F2C48A --description "Weekly SEO report" 2>/dev/null || true
          for n in $(gh issue list --label seo-report --state open --json number -q '.[].number'); do
            gh issue close "$n" --comment "Superseded by this week's report." || true
          done
          gh issue create --label seo-report --title "SEO weekly report $(date -u +%Y-%m-%d)" --body-file "$report"

      - name: Open issue on failure
        if: failure() || cancelled()
        run: |
          gh label create seo --color F2A341 --description "SEO content engine" 2>/dev/null || true
          gh issue create --label seo --title "SEO weekly maintenance failed ($(date -u +%Y-%m-%d))" \
            --body "Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
