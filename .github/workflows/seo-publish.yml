name: SEO publish

# Writes and publishes one article per run: Mon, Wed, Fri at 13:17 UTC (9:17am US Eastern).
# Guardrails in seo/config.yaml cap the blog at 3 posts per rolling 7 days.

on:
  schedule:
    - cron: "17 13 * * 1,3,5"
  workflow_dispatch:
    inputs:
      mode:
        description: "publish = commit and deploy; dry-run = generate only, download the result as an artifact"
        type: choice
        options: [dry-run, publish]
        default: dry-run
      keyword:
        description: "Optional: force this primary keyword"
        type: string
        required: false
      force:
        description: "Ignore the weekly cadence cap"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  issues: write
  pull-requests: write

concurrency:
  group: seo-content
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      GH_TOKEN: ${{ github.token }}
      MODE: ${{ github.event_name == 'schedule' && 'publish' || inputs.mode }}
    steps:
      # Always work from main, whatever branch a manual run was started from.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: seo/requirements.txt

      - name: Install
        run: pip install -r seo/requirements.txt

      # Subscription backend: headless Claude Code, pinned to the version whose flags
      # and token handling were verified (bump deliberately, then run a dry run).
      - name: Install Claude Code
        run: |
          backend=$(python -c "import yaml;print((yaml.safe_load(open('seo/config.yaml')).get('llm') or {}).get('backend','api'))")
          echo "LLM_BACKEND=$backend" >> "$GITHUB_ENV"
          if [ "$backend" = "subscription" ]; then
            npm install -g @anthropic-ai/claude-code@2.1.295
            claude --version
          fi

      - name: Self-test (offline)
        working-directory: seo
        run: python -m pytest

      - name: Preflight
        id: pre
        run: |
          if [ "$LLM_BACKEND" = "subscription" ]; then
            if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
              echo "::error::CLAUDE_CODE_OAUTH_TOKEN secret is not set. On your Mac run: claude setup-token, then add the token as a repository secret."
              exit 1
            fi
          elif [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is not set (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          pubmode=$(python -c "import yaml;print(yaml.safe_load(open('seo/config.yaml'))['publishing']['mode'])")
          echo "pubmode=$pubmode" >> "$GITHUB_OUTPUT"
          # Review mode: one article awaiting review at a time, so state never forks.
          if [ "$pubmode" = "review" ] && [ "$MODE" = "publish" ]; then
            pending=$(gh pr list --state open --json headRefName -q '.[].headRefName' | grep '^seo/' || true)
            if [ -n "$pending" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "### Skipped: article PR awaiting review ($pending)" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Generate article
        id: gen
        if: steps.pre.outputs.skip != 'true'
        working-directory: seo
        env:
          KEYWORD: ${{ inputs.keyword }}
          FORCE: ${{ inputs.force }}
        run: |
          set +e
          args=()
          [ -n "$KEYWORD" ] && args+=(--keyword "$KEYWORD")
          [ "$FORCE" = "true" ] && args+=(--force)
          python -m derot_seo publish "${args[@]}"
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 0 published, 10 skipped (cadence), 20 draft parked by the quality gate
          if [ $code -ne 0 ] && [ $code -ne 10 ] && [ $code -ne 20 ]; then exit $code; fi

      - name: Upload result (dry run)
        if: env.MODE == 'dry-run' && steps.gen.outputs.code != '10' && steps.gen.outputs.code != ''
        uses: actions/upload-artifact@v4
        with:
          name: seo-dry-run
          path: |
            seo/content/posts/
            seo/content/drafts/
            seo/out/
            seo/data/runs.jsonl
            blog/
            img/blog/
            about/
            seo/content/social/
            img/social/

      - name: Commit and publish
        id: push
        if: env.MODE == 'publish' && (steps.gen.outputs.code == '0' || steps.gen.outputs.code == '20')
        env:
          CODE: ${{ steps.gen.outputs.code }}
          TITLE: ${{ steps.gen.outputs.title }}
          SLUG: ${{ steps.gen.outputs.slug }}
          PUBMODE: ${{ steps.pre.outputs.pubmode }}
        run: |
          git config user.name "derot-seo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          if [ "$CODE" = "0" ]; then msg="SEO: publish $TITLE"; else msg="SEO: park draft $SLUG (failed quality gate)"; fi
          if [ "$PUBMODE" = "review" ] && [ "$CODE" = "0" ]; then
            branch="seo/$SLUG-$(date -u +%Y%m%d%H%M)"
            git checkout -b "$branch"
            git commit -m "$msg"
            git push origin "$branch"
            gh pr create --title "$msg" --base main --head "$branch" \
              --body "Generated by the SEO workflow. Review the article (blog/ and seo/content/posts/), then merge to publish. Social kit is in seo/out/social/."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "$msg"
          ok=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
          if [ "$ok" != "1" ]; then echo "::error::Could not push to main after 3 attempts"; exit 1; fi
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger GitHub Pages build
        if: steps.push.outputs.deployed == 'true'
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request failed (the push itself usually triggers a build)"

      - name: Notify search engines (IndexNow)
        if: steps.push.outputs.deployed == 'true' && steps.gen.outputs.code == '0'
        working-directory: seo
        env:
          URL: ${{ steps.gen.outputs.url }}
        run: |
          # Wait (up to 10 min) for Pages to deploy before pinging; never fails the run.
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            [ "$status" = "200" ] && break
            sleep 20
          done
          python -m derot_seo indexnow "$URL" "https://derot.org/blog/" "https://derot.org/sitemap.xml" "https://derot.org/"

      - name: Open issue for parked draft
        if: steps.gen.outputs.code == '20' && env.MODE == 'publish'
        env:
          SLUG: ${{ steps.gen.outputs.slug }}
        run: |
          gh label create seo --color F2A341 --description "SEO content engine" 2>/dev/null || true
          gh issue create --label seo \
            --title "SEO draft parked: $SLUG" \
            --body "The article did not pass the quality gate, so nothing was published. Run summary: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. The draft is in seo/content/drafts/$SLUG.json and its keyword retries automatically in 3 weeks. To publish it yourself: fix the JSON, then run the 'SEO build' workflow with promote_slug = $SLUG."

      - name: Open issue on failure
        if: failure() || cancelled()
        run: |
          gh label create seo --color F2A341 --description "SEO content engine" 2>/dev/null || true
          gh issue create --label seo \
            --title "SEO publish run failed ($(date -u +%Y-%m-%d))" \
            --body "The SEO publish run failed or timed out. Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Nothing was published by this run. The next scheduled run will try again."
