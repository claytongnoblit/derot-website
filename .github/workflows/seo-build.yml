name: SEO build

# Re-renders every generated page from seo/content/posts. Runs when templates,
# posts, or tool pages change (for example after a hand edit to a post's JSON),
# and on demand. Can also promote a hand-fixed parked draft.

on:
  push:
    branches: [main]
    paths:
      - "seo/content/posts/**"
      - "seo/templates/**"
      - "seo/assets/**"
      - "seo/pages/**"
      - "seo/derot_seo/site.py"
      - "seo/config.yaml"
      - "tools/**"
  workflow_dispatch:
    inputs:
      promote_slug:
        description: "Optional: slug of a fixed draft in seo/content/drafts to publish"
        type: string
        required: false

permissions:
  contents: write
  pages: write
  issues: write

concurrency:
  group: seo-content
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: seo/requirements.txt
      - run: pip install -r seo/requirements.txt
      - name: Test, validate, build
        working-directory: seo
        env:
          PROMOTE: ${{ inputs.promote_slug }}
        run: |
          python -m pytest
          if [ -n "$PROMOTE" ]; then python -m derot_seo promote "$PROMOTE"; fi
          python -m derot_seo validate
          python -m derot_seo build
      - name: Commit if anything changed
        run: |
          git config user.name "derot-seo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Already up to date"; exit 0; fi
          git commit -m "SEO: rebuild generated pages"
          ok=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
          if [ "$ok" != "1" ]; then echo "::error::Could not push to main after 3 attempts"; exit 1; fi
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
      - name: Open issue on failure
        if: failure() || cancelled()
        run: |
          gh label create seo --color F2A341 --description "SEO content engine" 2>/dev/null || true
          gh issue create --label seo --title "SEO build failed ($(date -u +%Y-%m-%d))" \
            --body "Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
