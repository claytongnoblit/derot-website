  caption: |-
    Three signs scrolling has you wound up, and a quick reset for it.

    Shoulders up. Breath short and high in your chest. Jaw tight. None of it means you did anything wrong. It's a cue to come back down.

    Start with one long, slow exhale. A few calming breaths is usually enough to take the edge off.

    DeRot is coming soon to iPhone. Launch list: link in bio.
  hashtags: [doomscrolling, mindfulscrolling, breathwork, digitalwellbeing]

- id: w3-fri-which
  week: 3
  day: fri
  platform: threads
