  day: wed
  platform: threads
  pillar: pov
  text: |-
    You don't need to delete everything. You don't need a 30-day reset. You don't need more willpower.

    You need a few calming breaths to come back down after the apps wind you up. A much smaller ask, and one you can actually keep.

