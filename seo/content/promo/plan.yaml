    DeRot doesn't need an account. The apps you choose are handled by Apple as private Screen Time tokens that stay on your phone.

    Less to think about, which is sort of the point.

    Coming soon to iPhone. Join the launch list: link in bio.
  hashtags: [digitalwellbeing, privacy, mindfultech]

- id: w4-tue-sigh
  week: 4
  day: tue
  platform: threads
  pillar: reset
  url: https://derot.org/tools/physiological-sigh/
  text: |-
    The physiological sigh: two inhales through the nose (a full one, then a short top-up), then one long exhale through the mouth.

    One or two of these can take the edge off quickly. Guide here:
    {url}

- id: w4-wed-guilty
  week: 4
  day: wed
  platform: threads
  pillar: pov
  text: |-
    We'd rather you keep scrolling and feel okay than quit scrolling and feel guilty.

    That's not a loophole. That's the whole point of DeRot: stay connected, feel calm.

- id: w4-thu-notice
  week: 4
  day: thu
  platform: threads
  pillar: product
  slides:
    - { template: phone, screen: reset-complete, crop: 0.1, headline: "Nicely done.", body: "Notice how you feel now." }
  text: |-
    The last screen of every DeRot reset says: "Nicely done. Notice how you feel now."

    That second line matters more than it looks. Noticing the shift is what makes the next reset easier to say yes to.

