# DeRot promotional posts for Threads and Instagram (see seo/SOCIAL.md, "Promo plan").
#
# Pre-launch: four weeks from `start`. Threads Mon-Fri, Instagram Reels Tue/Thu/Sat,
# on top of the automatic blog shares (Mon/Wed/Fri). Pillars rotate by weekday:
#   Mon feeling (name the wired-after-scroll state)   Tue reset (a 60-second technique)
#   Wed point of view (regulate, don't restrict)      Thu product (how DeRot works)
#   Fri building / conversation
# Launch: held until `python -m derot_seo social launch --date YYYY-MM-DD`, which
# needs site.app_store_url in config.yaml. `day` counts from the launch date.
#
# Instagram posts are Reels: a `reel` list of beats (hook, text, breathe, phone, end;
# see derot_seo/social_reels.py). The hook is the first frame, so it has to work on its
# own in about a second. `slides` on an Instagram post are only rendered for Threads
# posts that borrow them.
#
# Edit copy here, then run `python -m derot_seo social promo-build` and commit.
# Posts that already went out are never touched. Copy rules are checked on build.

start: 2026-10-12          # Monday of week 1
cta_url: https://derot.org/#newsletter
# Threads topic tag per pillar (one per post; a post can set its own `topic:`).
# Max 50 characters, no periods or ampersands.
topics:
  feeling: Doomscrolling
  reset: Breathwork
  pov: Digital Wellbeing
  product: Digital Wellbeing
  building: Building in Public
times:                     # UTC
  threads: "21:00"         # 5pm ET (4pm after Nov 1)
  instagram: "23:30"       # 7:30pm ET (6:30pm after Nov 1)

prelaunch:

# ---------------------------------------------------------------- week 1
- id: w1-mon-feeling
  week: 1
  day: mon
  platform: threads
  pillar: feeling
  text: |-
    You open the app to check one thing. Twenty minutes later your jaw is tight, your breath is shallow, and you feel wired for no reason you can name.

    You didn't do anything wrong. The feed is built to hold your attention, and your body quietly pays for it.

    We're building DeRot for that exact moment.

- id: w1-tue-meet
  week: 1
  day: tue
  platform: instagram
  pillar: product
  kicker: Meet DeRot
  slides:
    - { template: cover, headline: "Your apps wind you up. DeRot brings you back down." }
    - { template: phone, screen: myapps, headline: "Pick the apps that wind you up", body: "Social, games, reading, or just the one feed that always gets you." }
    - { template: phone, screen: shield, crop: 0.25, headline: "Mid-scroll, DeRot pauses you", body: "Not at the door. Right when the feed has wound you up." }
    - { template: phone, screen: breathing-inhale, crop: 0.1, headline: "Breathe for about a minute", body: "Nothing to get right. Just follow the circle." }
    - { template: phone, screen: reset-complete, crop: 0.1, headline: "Then back to your day, calmer", body: "Back to the feed, or not. Your call, just calmer." }
  closing: prelaunch
  caption: |-
    Your apps wind you up. DeRot brings you back down.

    Here's the idea. You pick the apps that tend to leave you wired. Mid-scroll, DeRot pauses the feed and walks you through about a minute of slow, easy breathing. Then you go back, or you don't. Either way, you're calmer.

    No account. No guilt charts. You're never locked out of anything.

    Coming soon to iPhone. Join the launch list: link in bio.
  hashtags: [digitalwellbeing, breathwork, mindfultech, calmreset]

- id: w1-tue-reset
  week: 1
  day: tue
  platform: threads
  pillar: reset
  text: |-
    A 60-second reset you can do right now, mid-scroll:

    Breathe in through your nose for 4.
    Breathe out slowly for 6.
    Repeat about six times.

    The longer exhale is the whole trick. By the third round, check where your shoulders are.

- id: w1-wed-pov
  week: 1
  day: wed
  platform: threads
  pillar: pov
  text: |-
    Most screen time apps treat you like you can't be trusted with your own phone. Walls, timers, guilt charts.

    We think the problem was never how many minutes you spent. It's how you feel when you put the phone down.

    Regulate, don't restrict.

- id: w1-thu-how
  week: 1
  day: thu
  platform: threads
  pillar: product
  images: { post: w1-tue-meet, slides: [3, 4, 5] }
  text: |-
    How DeRot works, in three steps:

    1. Pick the apps that wind you up.
    2. Mid-scroll, DeRot pauses you and opens a calming breath exercise.
    3. You go back to the feed, or you don't. Your call, just calmer.

    No account needed. Coming soon to iPhone.

- id: w1-fri-blockers
  week: 1
  day: fri
  platform: threads
  pillar: building
  text: |-
    Genuine question for anyone who has tried an app blocker: what made you turn it off?

    For a lot of people it's the feeling of being grounded by their own phone. That feeling is a big part of why DeRot pauses you instead of shutting your apps off.

- id: w1-sat-tell
  week: 1
  day: sat
  platform: instagram
  pillar: reset
  reel:
    - { beat: hook, text: "Your doomscroll has a tell." }
    - { beat: text, headline: "Check your shoulders right now.", secs: 2.6 }
    - { beat: text, headline: "Up by your ears? Jaw tight too?", secs: 2.6 }
    - { beat: breathe, pattern: calm, rounds: 2, title: "Let them drop. Breathe with this.", note: "Longer out than in. That's the whole trick." }
    - { beat: text, headline: "Feel the difference?", body: "DeRot brings this minute to you mid-scroll, right when the feed has wound you up." }
    - { beat: end, closing: prelaunch }
  caption: |-
    A breathing exercise for doomscrolling, because your doomscroll has a tell.

    Check your shoulders right now. Up by your ears? Jaw tight? That's the feed winding you up, quietly, while you weren't looking.

    Twenty seconds of slow breathing, with the exhale longer than the inhale (in for 4, out for 6), is often enough to take the edge off. Save this for the next time you catch it.

    Where did you feel it first? Tell us below.

    DeRot is coming soon to iPhone. It brings this minute to you mid-scroll. Launch list: link in bio.
  hashtags: [doomscrolling, breathwork, breathingexercise, calmreset]

# ---------------------------------------------------------------- week 2
