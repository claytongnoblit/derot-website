  week: 2
  day: mon
  platform: threads
  pillar: feeling
  text: |-
    Signs the scroll has gotten to you:

    You're reading the same comment twice.
    Your thumb is moving but nothing's going in.
    Your breathing has gone short and shallow.

    Not a character flaw. Just a cue to come back down for a minute.

- id: w2-tue-break01
  week: 2
  day: tue
  platform: instagram
  pillar: reset
  reel:
    - { beat: hook, kicker: "Scroll break 01", text: "Do this with us before you keep scrolling." }
    - { beat: breathe, pattern: calm, rounds: 3, title: "In for 4, out for 6", note: "Now go back to your feed. Or don't." }
    - { beat: end, closing: prelaunch }
  caption: |-
    Phone got your heart rate up? Here's a 30-second reset to come back down.

    In through your nose for 4. Out slowly for 6. Three rounds. The long exhale does the work.

    A new scroll break every week. Save this one for the next time the feed has you wired.

    DeRot pauses your apps while you reset with a few calming breaths. Coming soon to iPhone. Launch list: link in bio.
  hashtags: [scrollbreak, breathwork, breathingexercise, doomscrolling]

- id: w2-tue-box
  week: 2
  day: tue
  platform: threads
  pillar: reset
  url: https://derot.org/tools/box-breathing-timer/
  text: |-
    Box breathing, for when your head is buzzing:

    In for 4. Hold for 4. Out for 4. Hold for 4.

    Four rounds takes about a minute. Holds too long? Make them 2. Free timer:
    {url}

- id: w2-wed-minutes
  week: 2
  day: wed
  platform: threads
  pillar: pov
  text: |-
    Hot take: "use your phone less" is the wrong goal.

    An hour on your phone can leave you fine. Ten minutes can leave you wrecked. The minutes were never the point. How you feel after is.

- id: w2-thu-firmness
  week: 2
  day: thu
  platform: threads
  pillar: product
  slides:
    - { template: phone, screen: firmness, headline: "Three levels of firm", body: "Pick the one that fits how you want to feel." }
  text: |-
    Social media blockers too harsh for you?

    DeRot lets you pick how firm the pause is:

    Stay the course: the app stays paused until your reset is done.
    Flexible: skip after 10 seconds.
    Gentle reminder: a soft nudge, nothing required.

    Some days you want a firm hand. Some days a tap on the shoulder is plenty.

- id: w2-thu-check
  week: 2
  day: thu
  platform: instagram
  pillar: feeling
  reel:
    - { beat: hook, text: "You opened the app to check one thing." }
    - { beat: text, headline: "That was 40 minutes ago.", secs: 2.4 }
    - { beat: text, headline: "Jaw tight. Breath short. Weirdly wired.", secs: 3 }
    - { beat: text, headline: "You didn't do anything wrong.", body: "The feed is built to hold your attention. Your body quietly pays for it." }
    - { beat: phone, screen: shield, crop: 0.25, headline: "So DeRot meets you mid-scroll", body: "A short pause and about a minute of slow breathing. Then back to your day, calmer." }
    - { beat: end, closing: prelaunch }
  caption: |-
    You opened the app to check one thing. That was 40 minutes ago.

    If you feel a little wired now, that's not on you. Feeds are built to hold your attention. The tight jaw and short breath are the bill.

    DeRot meets you mid-scroll. It pauses your apps while you reset with a few calming breaths, then lets you get back to it, calmer.

    Coming soon to iPhone. Launch list: link in bio.
  hashtags: [mindfulscrolling, digitalwellbeing, doomscrolling, calmreset]

- id: w2-fri-door
  week: 2
  day: fri
  platform: threads
  pillar: building
  text: |-
    A design rule we keep coming back to: DeRot doesn't stand at the door.

    Plenty of apps make you breathe before the feed even loads. We wait until you're mid-scroll, because that's when you actually need it.

    We're not here to stop you. We're here to help you come back down.

- id: w2-sat-screentime
  week: 2
  day: sat
  platform: instagram
  pillar: pov
  reel:
    - { beat: hook, text: "Your screen time app is missing something." }
    - { beat: text, headline: "It counts your minutes.", secs: 2.2 }
    - { beat: text, headline: "It never asks how you feel when you put the phone down.", secs: 3.4 }
    - { beat: text, headline: "That's the part that matters.", body: "An hour can leave you fine. Ten minutes can leave you wrecked." }
    - { beat: text, headline: "Regulate, don't restrict.", body: "DeRot doesn't count your minutes. It pauses you mid-scroll for a calm reset, then gets out of the way." }
    - { beat: end, closing: prelaunch }
  caption: |-
    Your screen time report counts minutes. It doesn't count how you feel.

    You've probably had ten minutes that left you rattled and an hour that left you fine.

    We care about the part after. The tight jaw, the shallow breath, the buzz that follows you into whatever's next. DeRot helps you come back down from that.

    Coming soon to iPhone. Launch list: link in bio.
  hashtags: [screentime, digitalwellbeing, doomscrolling, mindfultech]

# ---------------------------------------------------------------- week 3
- id: w3-mon-tricky
  week: 3
  day: mon
  platform: threads
  pillar: feeling
  text: |-
    The feed doesn't feel stressful while you're in it. That's the tricky part.

    You only notice when you look up. Tight jaw, shallow breath, a low buzz. By then you've been carrying it a while.

- id: w3-tue-247
  week: 3
  day: tue
  platform: instagram
  pillar: reset
  reel:
    - { beat: hook, text: "POV: 2:47 AM, video 400 about nothing." }
    - { beat: text, headline: "Wide awake. Weirdly wired.", body: "The feed kept your mind busy, so your body never got the signal that the day is over." }
    - { beat: breathe, pattern: "478", rounds: 2, title: "Try this before the next one", note: "If the hold feels like too much, skip it." }
    - { beat: end, closing: prelaunch }
  caption: |-
    Can't sleep after scrolling in bed? Try 4-7-8 breathing before the next video.

    The feed keeps your mind busy, so your body never gets the cue to wind down.

    In for 4. Hold for 7. Out for 8. Two to four rounds is plenty. If the hold makes you lightheaded, skip it and make the exhale long.

    Save this for tonight.

    DeRot pauses your apps while you reset with a few calming breaths. Coming soon to iPhone. Launch list: link in bio.
  hashtags: [cantsleep, 478breathing, doomscrolling, breathwork]

- id: w3-tue-478
  week: 3
  day: tue
  platform: threads
  pillar: reset
  url: https://derot.org/tools/4-7-8-breathing-timer/
  text: |-
