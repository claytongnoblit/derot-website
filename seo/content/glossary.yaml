# DeRot glossary (hand-edited source of truth for /glossary/).
# One entry per term. `definition` is the one quotable sentence AI answers lift,
# so it names the term and defines it in plain words. `more` is 1-3 sentences of
# markdown with every factual claim linked to its source inline. `see` links to
# our own posts and tools. Same copy rules as the blog: no em dashes, no cure claims.

title: "Breathing and Calm Glossary"
meta_title: "Breathing and Nervous System Glossary | DeRot"
meta_description: "Plain-English, sourced definitions of breathing techniques, nervous system terms, and scrolling words, from box breathing and vagal tone to doomscrolling."
intro: "Short, sourced definitions for the words that come up around breathwork, your nervous system, and the scroll. Plain English first, then what the research says."
updated: "2026-11-11"

groups:
  - id: breathing
    name: Breathing techniques
  - id: body
    name: Your nervous system
  - id: scroll
    name: Scrolling and the feed

terms:

  # ------------------------------------------------------------ breathing
  - id: 4-6-breathing
    term: "4-6 breathing"
    aka: ["Calm 4-6", "4-6 breath"]
    group: breathing
    definition: "4-6 breathing is a slow breathing pattern where you inhale for 4 seconds and exhale for 6, which works out to 6 breaths per minute."
    more: "The longer exhale and the slow pace are the two ingredients most calming techniques share. Slow breathing in this range is linked to higher heart rate variability in [a 2022 meta-analysis](https://eprints.bournemouth.ac.uk/38169/). Calm 4-6 is the default reset in DeRot."
    see:
      - { url: /tools/calm-breathing-4-6/, label: "Calm 4-6 breathing timer" }
      - { url: /blog/4-6-breathing-how-to/, label: "How to do 4-6 breathing" }

  - id: box-breathing
    term: "Box breathing"
    aka: ["square breathing", "4-4-4-4 breathing"]
    group: breathing
    definition: "Box breathing is a technique where you inhale, hold, exhale, and hold again for an equal count, usually 4 seconds each."
    more: "The four equal sides give your attention something simple to follow, and the pace slows your breathing to about 4 breaths a minute. [Cleveland Clinic](https://health.clevelandclinic.org/box-breathing-benefits) describes it as a way to calm down in stressful moments. If the holds make you feel air hungry, shorten them."
    see:
      - { url: /tools/box-breathing-timer/, label: "Box breathing timer" }
      - { url: /blog/how-long-to-do-box-breathing/, label: "How long to do box breathing" }

  - id: 4-7-8-breathing
    term: "4-7-8 breathing"
    aka: ["4-7-8 breath", "relaxing breath"]
    group: breathing
    definition: "4-7-8 breathing is a technique where you inhale through your nose for 4 counts, hold for 7, and exhale through your mouth for 8."
    more: "It is often used at bedtime. Research is early: [a small 2022 study](https://www.ncbi.nlm.nih.gov/pmc/articles/PMC9277512/) in sleep-deprived young adults linked it to changes in heart rate variability and blood pressure. The long hold makes some people lightheaded, so a faster count is fine."
    see:
      - { url: /tools/4-7-8-breathing-timer/, label: "4-7-8 breathing timer" }

  - id: extended-exhale
    term: "Extended exhale breathing"
    aka: ["longer exhale breathing", "exhale-focused breathing"]
    group: breathing
    definition: "Extended exhale breathing is any pattern where each breath out lasts longer than the breath in, such as 4 seconds in and 6 or 8 out."
    more: "Exhale-focused practices did well in [a 2023 Stanford-led study](https://pmc.ncbi.nlm.nih.gov/articles/PMC9873947). Whether a longer exhale adds anything beyond simply breathing slowly is less settled: [one 2024 study](https://www.ncbi.nlm.nih.gov/pmc/articles/PMC11310264/) found slow pace mattered more than the ratio for heart rate variability."
    see:
      - { url: /tools/calm-breathing-4-6/, label: "Calm 4-6 breathing timer" }
      - { url: /blog/parasympathetic-breathing/, label: "Parasympathetic breathing" }

  - id: physiological-sigh
    term: "Physiological sigh"
    aka: ["double inhale", "sigh breath"]
    group: breathing
    definition: "A physiological sigh is a double inhale through the nose (one full breath, then a short top-up) followed by a long, slow exhale through the mouth."
    more: "Your body already sighs on its own every few minutes. Researchers have proposed that [spontaneous sighs act as a reset](https://research.vu.nl/en/publications/respiratory-variability-preceding-and-following-sighs-a-resetter-/) for your breathing pattern, and people report [relief after sighing](https://research.vu.nl/en/publications/take-a-deep-breath-the-relief-effect-of-spontaneous-and-instructe/). One or two is often enough to take the edge off."
    see:
      - { url: /tools/physiological-sigh/, label: "Physiological sigh guide" }
      - { url: /blog/how-long-to-do-physiological-sigh/, label: "How long to do a physiological sigh" }

  - id: cyclic-sighing
    term: "Cyclic sighing"
    aka: ["repeated physiological sighs"]
    group: breathing
    definition: "Cyclic sighing is the practice of repeating physiological sighs, a double inhale and a long exhale, for a few minutes at a time."
    more: "In [a 2023 study from Stanford](https://pmc.ncbi.nlm.nih.gov/articles/PMC9873947), five minutes a day of cyclic sighing for a month improved mood more than mindfulness meditation did. [Stanford Medicine](https://stanmed.stanford.edu/cyclic-sighing-stress-relief/) has a plain-language summary."
    see:
      - { url: /tools/physiological-sigh/, label: "Physiological sigh guide" }

  - id: coherent-breathing
    term: "Coherent breathing"
    aka: ["5-5 breathing", "6 breaths per minute"]
    group: breathing
    definition: "Coherent breathing is slow, even breathing at about 5 to 6 breaths per minute, often 5 seconds in and 5 seconds out."
    more: "This pace sits close to many people's resonance frequency. In [a 2014 study](https://pubmed.ncbi.nlm.nih.gov/24380741/), breathing at 5.5 breaths per minute increased heart rate variability compared with normal breathing."
    see:
      - { url: /tools/custom-breathing-timer/, label: "Custom breathing timer" }

  - id: resonance-frequency-breathing
    term: "Resonance frequency breathing"
    aka: ["resonance breathing", "HRV breathing"]
    group: breathing
    definition: "Resonance frequency breathing means breathing at the personal pace where your heart rate rises and falls the most with each breath, usually around 6 breaths per minute."
    more: "It is the core of HRV biofeedback training. [Lehrer and Gevirtz](https://pmc.ncbi.nlm.nih.gov/articles/PMC4104929) explain that at this pace, the heart rate and blood pressure rhythms line up and amplify each other. Without a heart rate sensor, 5.5 to 6 breaths per minute is a reasonable starting point."
    see:
      - { url: /tools/calm-breathing-4-6/, label: "Calm 4-6 breathing timer" }

  - id: paced-breathing
    term: "Paced breathing"
    aka: ["slow-paced breathing", "slow breathing"]
    group: breathing
    definition: "Paced breathing is breathing to a set rhythm, usually slower than your natural rate, by following a count, a timer, or a visual guide."
    more: "[A systematic review](https://www.ncbi.nlm.nih.gov/pmc/articles/PMC6137615/) of slow breathing (under 10 breaths a minute) linked it to higher heart rate variability and to feeling more relaxed and less anxious. A guide helps because counting on your own drifts faster when you are stressed."
    see:
      - { url: /tools/, label: "Free breathing timers" }

  - id: diaphragmatic-breathing
    term: "Diaphragmatic breathing"
    aka: ["belly breathing", "abdominal breathing"]
    group: breathing
    definition: "Diaphragmatic breathing is breathing that moves your belly rather than your chest, using the diaphragm, the dome-shaped muscle under your lungs."
    more: "[Cleveland Clinic](https://my.clevelandclinic.org/health/articles/9445-diaphragmatic-breathing) recommends it for relaxation and lists lower stress among its benefits. A quick check: put one hand on your chest and one on your belly, and let the belly hand move first."
    see:
      - { url: /blog/parasympathetic-breathing/, label: "Parasympathetic breathing" }

  - id: pursed-lip-breathing
    term: "Pursed-lip breathing"
    aka: []
    group: breathing
    definition: "Pursed-lip breathing is inhaling through your nose and exhaling slowly through lips shaped as if you were about to whistle."
    more: "It is a standard technique for people with lung conditions, and [Cleveland Clinic](https://my.clevelandclinic.org/health/treatments/9443-pursed-lip-breathing) notes it slows your breathing and helps you relax. The narrowed lips stretch the exhale without you having to count."
    see: []

  - id: nasal-breathing
    term: "Nasal breathing"
    aka: ["nose breathing"]
    group: breathing
    definition: "Nasal breathing is breathing in and out through your nose instead of your mouth."
    more: "[A 2024 study](https://www.ncbi.nlm.nih.gov/pmc/articles/PMC11178300/) found that breathing through the nose lowered diastolic blood pressure and increased the parasympathetic contribution to heart rate variability compared with mouth breathing. Most calming techniques start with a nasal inhale."
    see: []

  - id: breathwork
    term: "Breathwork"
    aka: ["breathing exercises", "breath practice"]
    group: breathing
    definition: "Breathwork is an umbrella term for any practice where you deliberately change how you breathe, from slow calming patterns to fast energizing ones."
    more: "Calming and energizing styles do very different things, so the label alone tells you little. [A 2023 meta-analysis](https://pmc.ncbi.nlm.nih.gov/articles/PMC9828383/) of randomized trials found breathwork was linked to lower self-reported stress, with small to medium effects."
    see:
      - { url: /blog/best-free-breathing-apps/, label: "Best free breathing apps" }

  - id: respiratory-rate
    term: "Respiratory rate"
    aka: ["breaths per minute", "breathing rate"]
    group: breathing
    definition: "Respiratory rate is the number of breaths you take per minute. A normal adult resting rate is 12 to 18 breaths per minute."
    more: "That range comes from [Cleveland Clinic](https://my.clevelandclinic.org/health/articles/10881-vital-signs). Most calming techniques bring you well below it, to around 4 to 6 breaths a minute, for a few minutes at a time."
    see: []

  - id: hyperventilation
    term: "Hyperventilation"
    aka: ["overbreathing"]
    group: breathing
    definition: "Hyperventilation is breathing faster or deeper than your body needs, which lowers carbon dioxide in your blood."
    more: "It can cause lightheadedness, tingling, and a racing heart, according to [Columbia University's health library](https://www.columbiadoctors.org/health-library/symptom/hyperventilation/). It is also why forcing very big breaths during a breathing exercise can backfire. Slower and softer is usually better than deeper."
    see: []

  # ------------------------------------------------------------ body
  - id: autonomic-nervous-system
    term: "Autonomic nervous system"
    aka: ["ANS"]
    group: body
    definition: "The autonomic nervous system is the part of your nervous system that runs things you do not consciously control, like heart rate, digestion, and breathing."
    more: "It has two main branches, the sympathetic and the parasympathetic, which [Cleveland Clinic](https://my.clevelandclinic.org/health/body/23273-autonomic-nervous-system) describes as working in balance. Breathing is unusual because it runs on autopilot but you can also take the wheel, which is why it is such a useful lever."
    see:
      - { url: /blog/parasympathetic-breathing/, label: "Parasympathetic breathing" }

  - id: fight-or-flight
    term: "Fight or flight"
    aka: ["sympathetic nervous system", "stress response"]
    group: body
    definition: "Fight or flight is your body's fast stress response, run by the sympathetic nervous system, which raises your heart rate and breathing to prepare you to act."
    more: "[Cleveland Clinic](https://my.clevelandclinic.org/health/body/23262-sympathetic-nervous-system-sns-fight-or-flight) explains that it evolved for physical threats. A tense feed can nudge the same system, which is part of why scrolling can leave you feeling wired."
    see:
      - { url: /blog/why-does-scrolling-make-me-anxious/, label: "Why scrolling can make you anxious" }

  - id: rest-and-digest
    term: "Rest and digest"
    aka: ["parasympathetic nervous system"]
    group: body
    definition: "Rest and digest is the calming mode of your parasympathetic nervous system, which slows your heart rate and supports digestion and recovery."
    more: "[Cleveland Clinic](https://my.clevelandclinic.org/health/body/23266-parasympathetic-nervous-system-psns) describes it as the counterweight to fight or flight. Slow breathing with a long exhale is one of the few ways to lean toward it on purpose."
    see:
      - { url: /blog/parasympathetic-breathing/, label: "Parasympathetic breathing" }

  - id: vagus-nerve
    term: "Vagus nerve"
    aka: ["Cranial nerve X"]
    group: body
    definition: "The vagus nerve is the longest cranial nerve, running from your brain to your gut, and a main pathway of the parasympathetic nervous system."
    more: "[Cleveland Clinic](https://my.clevelandclinic.org/health/body/22279-vagus-nerve) lists heart rate, blood pressure, breathing, and digestion among the functions it helps regulate. There are a lot of vagus nerve hacks online. Slow breathing is one of the best studied ways to work with it."
    see:
      - { url: /blog/nervous-system-overload-from-phone/, label: "Nervous system overload from your phone" }

  - id: vagal-tone
    term: "Vagal tone"
    aka: ["cardiac vagal tone"]
    group: body
    definition: "Vagal tone describes how strongly the vagus nerve is slowing your heart at any moment, usually estimated from heart rate variability."
    more: "Researchers often measure it through respiratory sinus arrhythmia, the rise and fall of heart rate with each breath. [Lewis, Porges, and colleagues](https://pmc.ncbi.nlm.nih.gov/articles/PMC3269511) compare the common ways of calculating it."
    see: []

  - id: heart-rate-variability
    term: "Heart rate variability"
    aka: ["HRV"]
    group: body
    definition: "Heart rate variability (HRV) is the small variation in time between one heartbeat and the next."
    more: "[Cleveland Clinic](https://my.clevelandclinic.org/health/symptoms/21773-heart-rate-variability-hrv) notes that higher HRV generally means your body adapts well to changing demands. Wearables like Apple Watch, Oura, and Whoop all estimate it. Slow breathing raises HRV while you do it, per [a 2022 meta-analysis](https://eprints.bournemouth.ac.uk/38169/)."
    see:
      - { url: /tools/calm-breathing-4-6/, label: "Calm 4-6 breathing timer" }

  - id: respiratory-sinus-arrhythmia
    term: "Respiratory sinus arrhythmia"
    aka: ["RSA"]
    group: body
    definition: "Respiratory sinus arrhythmia is the normal speeding up of your heart as you breathe in and slowing down as you breathe out."
    more: "Despite the name, it is healthy, not a heart problem. It is one of the main signals behind HRV and vagal tone, as [Lewis, Porges, and colleagues](https://pmc.ncbi.nlm.nih.gov/articles/PMC3269511) describe. It is also why a long exhale feels calming: the out-breath is when your heart slows."
    see: []

  - id: window-of-tolerance
    term: "Window of tolerance"
    aka: []
    group: body
    definition: "The window of tolerance is the zone of arousal where you can handle stress and still think clearly, between feeling keyed up (hyperarousal) and shut down (hypoarousal)."
    more: "The term was coined by psychiatrist Daniel Siegel, as [this overview](https://www.psychologytoday.com/us/blog/making-the-whole-beautiful/202205/what-is-the-window-of-tolerance-and-why-is-it-so-important) explains. A few slow breaths is one way to step back inside it when you notice you are drifting toward the edge."
    see:
      - { url: /blog/nervous-system-overload-from-phone/, label: "Nervous system overload from your phone" }

  - id: interoception
    term: "Interoception"
    aka: ["body awareness"]
    group: body
    definition: "Interoception is your awareness of signals from inside your body, like your heartbeat, breathing, hunger, and tension."
    more: "That is how [Cleveland Clinic](https://my.clevelandclinic.org/health/articles/interoception) defines it. It is what lets you notice that your jaw is clenched twenty minutes into a scroll. You can't settle a tension you haven't noticed yet."
    see:
      - { url: /blog/how-to-stop-doomscrolling/, label: "How to stop doomscrolling" }

  - id: nervous-system-regulation
    term: "Nervous system regulation"
    aka: ["self-regulation", "regulating your nervous system"]
    group: body
    definition: "Nervous system regulation is a wellness term for shifting your body from a stressed, keyed-up state back toward a calm, settled one."
    more: "It is not a medical diagnosis. In practice it means nudging the balance of your [autonomic nervous system](https://my.clevelandclinic.org/health/body/23273-autonomic-nervous-system) with things like slow breathing, movement, or rest. Regulate, don't restrict is the idea DeRot is built on."
    see:
      - { url: /blog/best-apps-nervous-system-regulation/, label: "Best apps for nervous system regulation" }

  # ------------------------------------------------------------ scroll
  - id: doomscrolling
    term: "Doomscrolling"
    aka: ["doomscroll", "doomsurfing"]
    group: scroll
    definition: "Doomscrolling is spending too much time scrolling through news or posts that make you feel sad, anxious, or angry."
    more: "[Merriam-Webster](https://www.merriam-webster.com/dictionary/doomscrolling) dates the word to 2020. Even brief exposure has a cost: in [one experiment](https://www.ncbi.nlm.nih.gov/pmc/articles/PMC8513826/), a few minutes of negative pandemic news lowered people's mood right away."
    see:
      - { url: /blog/how-to-stop-doomscrolling/, label: "How to stop doomscrolling" }
      - { url: /blog/doomscrolling-at-night/, label: "Doomscrolling at night" }

  - id: brain-rot
    term: "Brain rot"
    aka: ["brainrot"]
    group: scroll
    definition: "Brain rot is slang for the foggy, dulled feeling people blame on consuming too much trivial or low-effort online content."
    more: "[Oxford University Press](https://corp.oup.com/news/brain-rot-named-oxford-word-of-the-year-2024/) named it Word of the Year for 2024, noting usage rose 230% in a year and that Thoreau used the phrase in 1854. It is a cultural term, not a medical one."
    see:
      - { url: /blog/screen-time-guilt/, label: "Screen time guilt" }

  - id: infinite-scroll
    term: "Infinite scroll"
    aka: ["endless scroll"]
    group: scroll
    definition: "Infinite scroll is a design where new content loads automatically as you reach the bottom, so the feed never ends and there is no natural place to stop."
    more: "Its inventor, Aza Raskin, [testified in 2026](https://www.kob.com/new-mexico/inventor-of-infinite-scroll-says-he-regrets-it-at-new-mexico-meta-trial/) that he regrets creating it. Without a stopping cue, the decision to stop falls on you, usually after you are already wound up."
    see:
      - { url: /blog/why-does-scrolling-make-me-anxious/, label: "Why scrolling can make you anxious" }

  - id: passive-scrolling
    term: "Passive scrolling"
    aka: ["passive social media use"]
    group: scroll
    definition: "Passive scrolling is browsing a feed without posting, messaging, or commenting, just taking in other people's content."
    more: "In [a 2015 study](https://pubmed.ncbi.nlm.nih.gov/25706656/), passive Facebook use lowered how good people felt over time, while active use did not. [Later research](https://pmc.ncbi.nlm.nih.gov/articles/PMC7801842) suggests the active versus passive split is a useful, if imperfect, way to think about it."
    see:
      - { url: /blog/screen-time-app-not-blocker/, label: "A screen time app that is not a blocker" }

  - id: bedtime-procrastination
    term: "Bedtime procrastination"
    aka: []
    group: scroll
    definition: "Bedtime procrastination is going to bed later than you meant to, with nothing actually stopping you from going earlier."
    more: "The term comes from [a 2014 paper](https://pubmed.ncbi.nlm.nih.gov/24994989/) that introduced it as its own kind of procrastination and linked it to less sleep. A phone in bed is one of the easiest ways for it to happen."
    see:
      - { url: /blog/is-scrolling-before-bed-bad/, label: "Is scrolling before bed bad?" }

  - id: revenge-bedtime-procrastination
    term: "Revenge bedtime procrastination"
    aka: []
    group: scroll
    definition: "Revenge bedtime procrastination is staying up late on purpose to claim free time you did not get during the day, often by scrolling."
    more: "It is a popular phrase rather than a research term; studies call it [bedtime procrastination](#bedtime-procrastination). Research in teens has linked bedtime procrastination with [problematic smartphone use and worse sleep quality](https://www.ncbi.nlm.nih.gov/pmc/articles/PMC11059092/)."
    see:
      - { url: /blog/doomscrolling-at-night/, label: "Doomscrolling at night" }

  - id: dopamine-detox
    term: "Dopamine detox"
    aka: ["dopamine fasting"]
    group: scroll
    definition: "Dopamine detox is a trend of cutting out phones, media, and other stimulation for a stretch of time, based on the idea that it resets your brain's reward system."
    more: "The science behind the name does not hold up. A Harvard physician [explains](https://www.health.harvard.edu/blog/dopamine-fasting-misunderstanding-science-spawns-a-maladaptive-fad-2020022618917) that avoiding stimulation does not lower or reset dopamine, and that the psychiatrist who coined it meant a behavioral approach, not a literal fast."
    see:
      - { url: /blog/screen-time-guilt/, label: "Screen time guilt" }

  - id: friction
    term: "Friction (app design)"
    aka: ["design friction", "digital friction"]
    group: scroll
    definition: "Friction is a small, deliberate obstacle in an app, like a pause or a delay, that gives you a moment to choose instead of acting on autopilot."
    more: "Research on friction apps is promising: in [a 2023 study](https://pmc.ncbi.nlm.nih.gov/articles/PMC9974409) of the app one sec, a short delay before opening an app reduced how often people opened it. DeRot uses a breathing pause as its friction, mid-scroll rather than at the door."
    see:
      - { url: /blog/screen-time-app-not-blocker/, label: "A screen time app that is not a blocker" }

  - id: calm-technology
    term: "Calm technology"
    aka: ["calm tech"]
    group: scroll
    definition: "Calm technology is a design idea where technology informs you without demanding your attention, staying in the background until you need it."
    more: "Mark Weiser and John Seely Brown of Xerox PARC introduced it in [Designing Calm Technology](https://calmtech.com/papers/designing-calm-technology) in the mid-1990s. Most feeds are built on the opposite principle."
    see: []

  - id: mindful-minutes
    term: "Mindful minutes"
    aka: ["Mindful Minutes (Apple Health)"]
    group: scroll
    definition: "Mindful minutes is the Apple Health category that logs time spent on breathing or meditation sessions."
    more: "Apple Watch's [Mindfulness app](https://support.apple.com/HT206999) records its Breathe and Reflect sessions there, and other apps can write to it too."
    see:
      - { url: /blog/best-free-breathing-apps/, label: "Best free breathing apps" }
