<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ meta_title }}</title>
  <meta name="description" content="{{ meta_description }}" />
  <link rel="canonical" href="{{ canonical }}" />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="alternate" type="application/rss+xml" title="DeRot Journal" href="{{ base_url }}/blog/feed.xml" />
  <meta property="og:site_name" content="DeRot" />
  <meta property="og:type" content="{{ og_type | default('website') }}" />
  <meta property="og:title" content="{{ og_title | default(meta_title) }}" />
  <meta property="og:description" content="{{ meta_description }}" />
  <meta property="og:url" content="{{ canonical }}" />
  <meta property="og:image" content="{{ og_image }}" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="en_US" />
  {% if published_iso %}<meta property="article:published_time" content="{{ published_iso }}" />
  <meta property="article:modified_time" content="{{ modified_iso }}" />{% endif %}
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{ og_title | default(meta_title) }}" />
  <meta name="twitter:description" content="{{ meta_description }}" />
  <meta name="twitter:image" content="{{ og_image }}" />
  <meta name="theme-color" content="#0C0907" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=DM+Serif+Display&family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300;1,9..144,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/amber.css" />
  <link rel="stylesheet" href="/blog/blog.css" />
  {% for block in jsonld %}<script type="application/ld+json">{{ block | safe }}</script>
  {% endfor %}
</head>
<body>

  <div class="glow quiet" aria-hidden="true"></div>

  <nav>
    <a href="/" class="logo">DeRot</a>
    <div class="nav-links">
      <a href="/blog/">Blog</a>
      <a href="/tools/">Breathing tools</a>
      <a href="/support.html">Support</a>
    </div>
  </nav>

  <main>
{% block main %}{% endblock %}
  </main>

  <footer>
    <p>
      <a href="/blog/">Blog</a>
      <a href="/tools/">Breathing tools</a>
      <a href="/about/">About</a>
      <a href="/privacy.html">Privacy Policy</a>
      <a href="/support.html">Support</a>
    </p>
    <p style="margin-top: 10px;">© {{ year }} DeRot</p>
    <p style="margin-top: 4px; opacity: 0.75;">NinetyFourVentures LLC</p>
  </footer>

{% block scripts %}{% endblock %}
<!-- Cloudflare Web Analytics --><script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "88986d6b96cc48b1920f4b9a088e7c35"}'></script><!-- End Cloudflare Web Analytics -->
</body>
</html>
